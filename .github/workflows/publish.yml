name: Pubblica notizie aviazione
# ping per forzare la registrazione dello schedule su GitHub

on:
  schedule:
    # Ogni 30 minuti, spostato di qualche minuto dal tondo (:07 e :37 invece
    # di :00/:30) per evitare i picchi di carico GitHub che rallentano i cron
    # esattamente sui minuti tondi. Orario UTC: Italia = UTC+1 inverno, UTC+2 estate.
    - cron: "7,37 * * * *"
  workflow_dispatch: {}   # permette anche l'avvio manuale da GitHub

# Serve il permesso di scrittura per poter ricommittare posted_ids.json
permissions:
  contents: write

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Esegui il bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python bot.py

      - name: Salva lo stato (notizie pubblicate + rotazione fonti) nel repo
        run: |
          git config user.name "aviazione-bot"
          git config user.email "actions@github.com"
          git add posted_ids.json rotazione_fonte.json
          git diff --staged --quiet || git commit -m "Aggiorna stato bot [skip ci]"
          git push
